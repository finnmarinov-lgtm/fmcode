<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#1d2026"/>
  <!-- Controller: Körper und zwei Griffe -->
  <g fill="#ece6da">
    <rect x="7" y="19" width="50" height="22" rx="11"/>
    <circle cx="17.5" cy="40" r="9"/>
    <circle cx="46.5" cy="40" r="9"/>
  </g>
  <!-- Steuerkreuz -->
  <g fill="#1d2026">
    <rect x="13" y="28.4" width="10" height="3.6" rx="1"/>
    <rect x="16.2" y="25.2" width="3.6" height="10" rx="1"/>
  </g>
  <!-- Knöpfe in den Farben der beiden Spiele: Gold (Feuer Frei), Rot der Pose (Petri Heil) -->
  <circle cx="44" cy="26.5" r="3.4" fill="#f2b636"/>
  <circle cx="50" cy="32.5" r="3.4" fill="#e4573d"/>
</svg>
